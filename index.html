<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽爾號Q版圖庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="賽爾號Q版圖片分享，免費瀏覽與下載。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 星空色帶的頁首 + 分類膠囊列 + 瀑布流圖片牆 + 全螢幕預覽 */
:root {
  --bg: #EEF4F7;
  --surface: #FFFFFF;
  --ink: #1B2A3A;
  --muted: #5B6B7B;
  --line: #D5E1E8;
  --accent: #FF8A3D;
  --accent-ink: #FFFFFF;
  --teal: #1F9E90;
  --band: #16263A;
  --band-ink: #F2F7FA;
  --shade: rgba(16, 28, 42, .88);
  --font: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1823; --surface: #172535; --ink: #E7EFF4; --muted: #9DB0C0; --line: #24384C;
    --accent: #FF9B57; --accent-ink: #1B1206; --teal: #4CD2C1; --band: #0A121B; --band-ink: #F2F7FA;
    --shade: rgba(4, 9, 14, .92); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1823; --surface: #172535; --ink: #E7EFF4; --muted: #9DB0C0; --line: #24384C;
  --accent: #FF9B57; --accent-ink: #1B1206; --teal: #4CD2C1; --band: #0A121B; --band-ink: #F2F7FA;
  --shade: rgba(4, 9, 14, .92); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, a { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 頁首 */
.hero { position: relative; overflow: hidden; background: var(--band); color: var(--band-ink);
  margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .wrap { position: relative; padding-block: 44px 36px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.badge { flex: none; width: 64px; height: 64px; }
.hero h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 900; line-height: 1.15; letter-spacing: .02em; text-wrap: balance; }
.hero h1 span { color: var(--accent); }
.hero p { margin: 4px 0 0; color: #B9CAD8; font-weight: 500; }
.stats { display: flex; gap: 22px; font-variant-numeric: tabular-nums; }
.stats div { display: grid; }
.stats b { font-size: 28px; font-weight: 900; line-height: 1.1; }
.stats small { color: #B9CAD8; font-size: 12px; letter-spacing: .08em; }

/* 工具列 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip i { font-style: normal; opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.search { flex: 0 1 240px; min-width: 0; position: relative; }
.search input { width: 100%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px 7px 36px; font: inherit; font-size: 14px; }
.search input:focus { outline: none; border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
@media (max-width: 560px) { .search { flex: 1 1 100%; order: -1; } }
@media (max-width: 600px) { .grid { columns: 2; column-gap: 10px; } .card { margin-bottom: 10px; } .card .meta { padding: 8px 6px 8px 10px; } .card h3 { font-size: 14px; } .dl { width: 34px; height: 34px; } }

/* 圖片牆 */
main .wrap { padding-block: 24px 48px; }
.grid { columns: 4 240px; column-gap: 16px; }
.card { break-inside: avoid; margin: 0 0 16px; background: var(--surface); border-radius: var(--r); overflow: hidden; border: 2px solid var(--line); position: relative; transition: transform .18s ease, border-color .18s ease; }
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card button.open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.card img { display: block; width: 100%; height: auto; background: var(--line); min-height: 80px; }
.card .meta { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; }
.card .meta div { flex: 1; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { color: var(--muted); font-size: 12px; }
.card .new { position: absolute; top: 10px; left: 10px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 900; padding: 2px 10px; border-radius: 999px; letter-spacing: .06em; }
.dl { flex: none; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--bg); color: var(--ink); text-decoration: none; border: 2px solid transparent; }
.dl:hover { background: var(--accent); color: var(--accent-ink); }
.dl svg { width: 18px; height: 18px; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }
.empty b { display: block; color: var(--ink); font-size: 18px; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-block: 20px 32px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

/* 預覽視窗 */
.lb { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: grid; grid-template-rows: auto 1fr auto; color: #F2F7FA;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.lb-top, .lb-bottom { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.lb-top { justify-content: space-between; }
.lb-title { min-width: 0; }
.lb-title b { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-title small { color: #B9CAD8; font-variant-numeric: tabular-nums; }
.lb-stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 0 64px; }
.lb-stage img { max-width: 100%; max-height: calc(100vh - 170px); max-height: calc(100dvh - 170px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); object-fit: contain; border-radius: 12px; user-select: none; }
.icon-btn { flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
.icon-btn:hover { background: rgba(255,255,255,.24); }
.icon-btn svg { width: 22px; height: 22px; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); }
.nav.prev { left: 10px; } .nav.next { right: 10px; }
.lb-bottom { justify-content: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 22px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: rgba(255,255,255,.12); color: #fff; }
.btn:hover { filter: brightness(1.08); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; }
@media (max-width: 560px) { .lb-stage { padding: 0 8px; } .nav { display: none; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>

<header class="hero">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="brand">
      <svg class="badge" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="36" r="22" fill="#FF8A3D" stroke="#F2F7FA" stroke-width="3"/>
        <line x1="32" y1="14" x2="38" y2="4" stroke="#F2F7FA" stroke-width="3" stroke-linecap="round"/>
        <circle cx="39" cy="4" r="3.5" fill="#FFD84D"/>
        <ellipse cx="25" cy="34" rx="3.5" ry="4.5" fill="#16263A"/><ellipse cx="39" cy="34" rx="3.5" ry="4.5" fill="#16263A"/>
        <path d="M28 43 q4 4 8 0" stroke="#16263A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="20" cy="41" rx="3.5" ry="2" fill="#FF6F8E" opacity=".7"/><ellipse cx="44" cy="41" rx="3.5" ry="2" fill="#FF6F8E" opacity=".7"/>
      </svg>
      <div>
        <h1>賽爾號 <span>Q版</span> 圖庫</h1>
        <p>我畫的Q版小圖都放這裡，喜歡就點下載帶回家！</p>
      </div>
    </div>
    <div class="stats" aria-live="polite">
      <div><b id="stat-count">0</b><small>張圖片</small></div>
      <div><b id="stat-cats">0</b><small>個分類</small></div>
    </div>
  </div>
</header>

<nav class="bar" aria-label="篩選">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="分類"></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="搜尋圖片名稱" aria-label="搜尋圖片名稱">
    </label>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><b>找不到圖片</b>換個關鍵字或分類試試看。</div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>粉絲自製分享站，圖片僅供個人收藏使用，轉載請註明出處。</span>
    <span>賽爾號相關角色版權屬原權利人所有。</span>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lb-name" hidden>
  <div class="lb-top">
    <div class="lb-title"><b id="lb-name"></b><small id="lb-info"></small></div>
    <button class="icon-btn" id="lb-close" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button class="icon-btn nav prev" id="lb-prev" aria-label="上一張"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img id="lb-img" alt="">
    <button class="icon-btn nav next" id="lb-next" aria-label="下一張"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="lb-bottom">
    <a class="btn primary" id="lb-dl" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>下載原圖</a>
    <button class="btn ghost" id="lb-copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>複製分享連結</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
  const NEW_MS = 7 * 24 * 3600 * 1000;
  let all = [], shown = [], cat = '全部', current = -1;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fileName = (src) => decodeURIComponent(src.split('/').pop());
  const ext = (src) => src.split('.').pop().toUpperCase();
  const size = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const idOf = (src) => { let h = 0; for (const c of src) h = (h * 31 + c.codePointAt(0)) >>> 0; return 'p-' + h.toString(36); };
  const url = (src) => src.split('/').map(encodeURIComponent).join('/');

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 1800);
  }

  function renderChips() {
    const counts = {};
    all.forEach((p) => (counts[p.category] = (counts[p.category] || 0) + 1));
    const cats = ['全部', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
    $('chips').innerHTML = cats.map((c) =>
      `<button class="chip" aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}<i>${c === '全部' ? all.length : counts[c]}</i></button>`).join('');
    $('stat-count').textContent = all.length;
    $('stat-cats').textContent = cats.length - 1;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    shown = all.filter((p) => (cat === '全部' || p.category === cat) && (!q || p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
    const now = Date.now();
    $('grid').innerHTML = shown.map((p, i) => `
      <figure class="card">
        <button class="open" data-i="${i}" aria-label="放大查看 ${esc(p.title)}">
          <img src="${esc(url(p.src))}" alt="${esc(p.title)}" loading="lazy" decoding="async">
        </button>
        ${now - p.added < NEW_MS ? '<span class="new">NEW</span>' : ''}
        <figcaption class="meta">
          <div><h3>${esc(p.title)}</h3><small>${esc(p.category)} · ${ext(p.src)} · ${size(p.bytes)}</small></div>
          <a class="dl" href="${esc(url(p.src))}" download="${esc(fileName(p.src))}" aria-label="下載 ${esc(p.title)}" title="下載">${DL_ICON}</a>
        </figcaption>
      </figure>`).join('');
    $('empty').hidden = shown.length > 0;
  }

  function open(i) {
    if (!shown.length) return;
    current = (i + shown.length) % shown.length;
    const p = shown[current];
    const img = $('lb-img');
    img.src = url(p.src); img.alt = p.title;
    $('lb-name').textContent = p.title;
    $('lb-info').textContent = `${current + 1} / ${shown.length} · ${p.category} · ${size(p.bytes)}`;
    img.onload = () => { $('lb-info').textContent = `${current + 1} / ${shown.length} · ${p.category} · ${img.naturalWidth} × ${img.naturalHeight} px · ${size(p.bytes)}`; };
    const dl = $('lb-dl'); dl.href = url(p.src); dl.setAttribute('download', fileName(p.src));
    $('lb').hidden = false; document.body.style.overflow = 'hidden';
    history.replaceState(null, '', '#' + idOf(p.src));
    $('lb-close').focus({ preventScroll: true });
  }
  function close() {
    $('lb').hidden = true; document.body.style.overflow = ''; current = -1;
    history.replaceState(null, '', location.pathname + location.search);
  }

  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    cat = b.dataset.cat; renderChips(); render();
  });
  $('q').addEventListener('input', render);
  $('grid').addEventListener('click', (e) => { const b = e.target.closest('.open'); if (b) open(+b.dataset.i); });
  $('lb-close').onclick = close;
  $('lb-prev').onclick = () => open(current - 1);
  $('lb-next').onclick = () => open(current + 1);
  $('lb').addEventListener('click', (e) => { if (e.target.id === 'lb-stage') close(); });
  document.addEventListener('keydown', (e) => {
    if ($('lb').hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') open(current - 1);
    if (e.key === 'ArrowRight') open(current + 1);
  });
  let sx = null;
  $('lb-stage').addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true });
  $('lb-stage').addEventListener('touchend', (e) => {
    if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) open(current + (dx < 0 ? 1 : -1));
  });
  $('lb-copy').onclick = () => {
    const link = location.href.split('#')[0] + '#' + idOf(shown[current].src);
    const done = () => toast('已複製連結');
    try { navigator.clipboard.writeText(link).then(done, () => showLink(link)); } catch (e) { showLink(link); }
  };
  function showLink(link) { toast(link); }

  function openFromHash() {
    const h = location.hash.slice(1); if (!h) return;
    const i = shown.findIndex((p) => idOf(p.src) === h); if (i >= 0) open(i);
  }

  fetch('images.json', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : []))
    .catch(() => [])
    .then((list) => { all = list; renderChips(); render(); openFromHash(); });

  // 頁首的小星星
  const cv = $('stars'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [];
  function size_() {
    const r = devicePixelRatio || 1; cv.width = cv.offsetWidth * r; cv.height = cv.offsetHeight * r;
    stars = Array.from({ length: Math.round(cv.width * cv.height / 9000) }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height, s: (Math.random() * 1.6 + .4) * r, p: Math.random() * 6.28 }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      ctx.globalAlpha = reduce ? .7 : .35 + .35 * Math.sin(t / 900 + s.p);
      ctx.fillStyle = s.s > 1.6 ? '#FFD84D' : '#F2F7FA';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.28); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  size_(); addEventListener('resize', size_); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
